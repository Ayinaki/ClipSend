name: Deploy website to GitHub Pages

# Builds the React landing page in WEBSITE/ and publishes it to Pages.
# Runs on pushes to main that touch the site, and manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "WEBSITE/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

# Grant the workflow permission to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and don't cancel a half-finished deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs: this workflow holds pages:write and
      # id-token:write, so a repointed mutable tag would run unreviewed code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WEBSITE/package-lock.json

      # Pages serves the site under /ClipSend/ because the repo name is ClipSend.
      - name: Install and build
        run: |
          cd WEBSITE
          npm ci
          npm run build

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: WEBSITE/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
