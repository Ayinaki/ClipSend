name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch FFmpeg, FFprobe & Gifski Binaries
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (!(Test-Path "bin")) { New-Item -ItemType Directory -Path "bin" }

          # Preferred: the minimal ffmpeg/ffprobe built by the build-ffmpeg
          # workflow (~30 MB total vs ~196 MB gyan builds). Fetch the latest
          # successful run's artifact; fall back to gyan.dev builds below.
          $slimOk = $false
          try {
            $run = (Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/build-ffmpeg.yml/runs?status=success&per_page=1" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }).workflow_runs | Select-Object -First 1
            if ($run) {
              $artifacts = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/artifacts" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
              $art = $artifacts.artifacts | Where-Object { $_.name -eq 'ffmpeg-minimal-win64' } | Select-Object -First 1
              if ($art) {
                Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($art.id)/zip" -OutFile "slim-ffmpeg.zip" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
                Expand-Archive -Path "slim-ffmpeg.zip" -DestinationPath "slim-ffmpeg" -Force
                $slimFfmpeg = Get-ChildItem -Path "slim-ffmpeg" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
                $slimFfprobe = Get-ChildItem -Path "slim-ffmpeg" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
                if ($slimFfmpeg -and $slimFfprobe) {
                  Copy-Item $slimFfmpeg.FullName -Destination "bin/ffmpeg.exe"
                  Copy-Item $slimFfprobe.FullName -Destination "bin/ffprobe.exe"
                  $slimOk = $true
                  Write-Host "Installed minimal FFmpeg binaries from build-ffmpeg run $($run.id)."
                }
                Remove-Item -Recurse -Force "slim-ffmpeg.zip", "slim-ffmpeg" -ErrorAction SilentlyContinue
              }
            }
          } catch {
            Write-Host "Slim artifact unavailable, falling back to gyan builds: $_"
          }

          if (!$slimOk) {
            Write-Host "Downloading FFmpeg release binaries (fallback)..."
            $urls = @(
              "https://github.com/GyanD/codexffmpeg/releases/download/7.0/ffmpeg-7.0-essentials_build.zip",
              "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2024-04-30-12-50/ffmpeg-n7.0-latest-win64-gpl-7.0.zip"
            )
            $downloadSuccess = $false
            foreach ($url in $urls) {
              try {
                Write-Host "Attempting download from ${url}..."
                Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -TimeoutSec 120
                $downloadSuccess = $true
                break
              } catch {
                Write-Host "Download failed from ${url}"
              }
            }
            if (!$downloadSuccess) {
              throw "Failed to download FFmpeg from all mirror URLs."
            }
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
            $ffmpeg = Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            $ffprobe = Get-ChildItem -Path "ffmpeg_temp" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
            Copy-Item $ffmpeg.FullName -Destination "bin/ffmpeg.exe"
            Copy-Item $ffprobe.FullName -Destination "bin/ffprobe.exe"
            Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_temp"
            Write-Host "FFmpeg binaries installed successfully to bin/."
          }

          if (!(Test-Path "bin/gifski.exe")) {
            Write-Host "Downloading Gifski binary..."
            try {
              Invoke-WebRequest -Uri "https://gif.ski/gifski-1.32.0.zip" -OutFile "gifski_dl.zip" -TimeoutSec 120
              Expand-Archive -Path "gifski_dl.zip" -DestinationPath "gifski_temp" -Force
              $gifskiExe = Get-ChildItem -Path "gifski_temp" -Filter "gifski.exe" -Recurse | Select-Object -First 1
              if ($gifskiExe) {
                Copy-Item $gifskiExe.FullName -Destination "bin/gifski.exe" -Force
                Write-Host "Gifski binary installed successfully to bin/gifski.exe."
              }
              Remove-Item -Recurse -Force "gifski_dl.zip", "gifski_temp" -ErrorAction SilentlyContinue
            } catch {
              Write-Host "Warning: Failed to download Gifski binary from gif.ski."
            }
          }

      - name: Verify FFmpeg can decode AV1 (libdav1d present)
        shell: powershell
        run: |
          # The release fetches the *latest successful* slim-ffmpeg artifact, which
          # may predate the dav1d fix. Without libdav1d (the only software AV1
          # decode path - the native 'av1' decoder is HW-only), AV1 clips silently
          # fail everywhere: merge thumbnails, trims, and re-encodes. Fail the
          # release here instead of shipping a stale pre-dav1d binary.
          $decoders = & .\bin\ffmpeg.exe -hide_banner -decoders 2>&1 | Out-String
          if ($decoders -notmatch 'libdav1d') {
            throw "Fetched bin\ffmpeg.exe has no libdav1d decoder - AV1 clips would silently fail (merge thumbnails, trims, re-encodes). Re-run the 'Build Minimal FFmpeg' workflow so the release picks up a dav1d-capable artifact."
          }
          Write-Host "OK: bin\ffmpeg.exe has libdav1d (software AV1 decode)"

      - name: Run Unit Tests
        run: npm test

      - name: Build Electron Executable
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release & Upload Executable
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
