name: 🐛 Bug Report
description: Create a report to help us fix a bug or issue in ClipSend
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please fill out the sections below to help us debug.

  - type: input
    id: app-version
    attributes:
      label: ClipSend Version
      description: What version of ClipSend are you running? (e.g. v1.6.0)
      placeholder: v1.6.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Other / Unknown
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open file '...'
        2. Set trim range to '...'
        3. Click Export...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should have happened...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Console Output
      description: Paste any error messages or log snippets here.
      placeholder: Paste logs here...
    validations:
      required: false
